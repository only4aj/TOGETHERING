<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Togethering - Watch it Together</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    {% load static %}
    <link rel="stylesheet" href="{% static "css/homeee.css" %}">
</head>
<body>
    <nav class="greycon">
        <a href="{% url 'home' %}"><h1 class="goldclr">TOGETHER.<span class="coloringgg">ING</span></h1></a>
        
        <ul id="username">
            <li>
                <a href="{% url 'home' %}" class="profont">{{user.username}} <i class="fa-solid fa-chevron-down"></i></a>
                <ul class="profile" id="profile">
                    <li><a href="{% url 'logout' %}" onclick="location.reload()">Logout</a></li>
                </ul>
            </li>

        </ul>

    </nav>

    <div class="maincontainer">
        <h1 class="watchead">Watch IT Together</h1>
        <div class="innercontainer">
            <div class="text">
                <h1 class="linkhead">Link: </h1>
            </div>
            <div class="field">
                {% comment %} <p>{{room_name}}</p> {% endcomment %}
                <form method="post" action="/watch/{{room_name}}/">
                    {% csrf_token %}
                    <input class="linkbox" type="text" name="room" id="room" placeholder="Example: https://www.youtube.com/watch?v=SMcPnQ4ZsmA" required>
    
                    <button type="submit" id="submit" value="submit" class="gobtn">Go →</button>
                </form>
                
            </div>
        </div>
    </div>
    <footer>
        <div class="fooflex">

            <div class="handles">
                <a href="https://www.facebook.com/john.byro.56"><img src="{% static "images/facebook.png" %}" alt="F" width="35px" height="35px"></a>
                <a href="https://www.linkedin.com/in/only4aj/"><img src="{% static "images/linkedin.png" %}" alt="L" width="35px" height="35px"></a>
                <a href="https://www.instagram.com/only4aj/"><img src="{% static "images/instagram.png" %}" alt="I" width="35px" height="35px"></a>
                <a href="https://www.youtube.com/channel/UC23C6Vghe1eROCsvEyM-4hQ"><img src="{% static "images/youtube.png" %}" alt="Y" width="35px" height="35px"></a>
            </div>

            <p class="copyright">Copyright © 2024 TOGETHERING</p>
            <p>ANSH JUNEJA</p>
        </div>
    </footer>

    <div id="room_name" data-room-name="{{ room_name }}"></div>

    <script>
    btn.onclick = function(e){
        var roomname = "{{room_name}}";
        window.location.pathname = "/watch/" + roomname + "/";
    };

    // WebSocket Connection
    var socket = new WebSocket("wss://" + window.location.host + "/ws/watch/{{ room_name }}/");

    // Function to send play event to WebSocket server
    function sendPlayEvent(currentTime) {
        var message = {
            'message_type': 'video.play',
            'current_time': currentTime
        };
        socket.send(JSON.stringify(message));
    }

    // Function to send pause event to WebSocket server
    function sendPauseEvent(currentTime) {
        var message = {
            'message_type': 'video.pause',
            'current_time': currentTime
        };
        socket.send(JSON.stringify(message));
    }
</script>

<script>

    const roomname = JSON.parse(document.getElementById("roomname").textContent);
    const chatsocket = new WebSocket(
        'wss://' + window.location.host + '/ws/watch/' + roomname + '/'
    );
    chatsocket.onmessage = function(e){
        const data = JSON.parse(e.data);
        document.querySelector("#chatarea").value += (data.user + ":" + '\n' + data.message + '\n' + '\n');
    };
    document.getElementById("chatbtn").onclick = function(e){
        const msg = document.getElementById("chatinput").value;
        chatsocket.send(JSON.stringify({'message':msg}));
        document.querySelector("#chatinput").value ='';
    };
    chatsocket.onclose = function(e){
        console.log("chatsocket close");
    };
    document.querySelector("#chatinput").focus();
    document.querySelector("#chatinput").onkeyup = function(e){
        if (e.keyCode === 13) {
            document.querySelector("#chatbtn").click();
        }
    };

    document.getElementById("vidlink").onkeyup = function(e) {
        var video = document.getElementById("vidlink");
        console.log(video)
        if (e.keyCode === 13) { 
            e.preventDefault(); 
            const link = document.getElementById("vidlink").value.trim(); // Get the entered video link
            
            if (link !== '') {
                if (chatsocket.readyState === WebSocket.OPEN) {
                    chatsocket.send(JSON.stringify({'message_type': 'video.play', 'url': link}));
                } else {
                    console.error("WebSocket connection is not open.");
                }
            }

            document.getElementById("vidlink").value = '';
        }
    };
    </script>
</body>
</html>
